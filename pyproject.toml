[project]
name = "cloudops-remediation-agent"
version = "0.1.0"
description = "Human-in-the-loop AI agent that finds idle cloud VMs and remediates them after operator approval."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "anthropic>=0.60",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "httpx>=0.27",
    "playwright>=1.45",
    "pytest-cov>=5.0",
    "ruff>=0.17.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "e2e: browser tests that start a live server (Playwright)",
    "llm: calls the real Claude API (skipped without ANTHROPIC_API_KEY)",
]
addopts = "-ra"

[tool.uv]
package = false

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
ignore = ["B008"]  # FastAPI Depends() in defaults is idiomatic
