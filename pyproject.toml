[project]
name = "cloudops-remediation-agent"
version = "0.1.0"
description = "Human-in-the-loop AI agent that finds idle cloud VMs and remediates them after operator approval."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "anthropic>=0.60",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "httpx>=0.27",
    "playwright>=1.45",
    "pytest-cov>=5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "e2e: browser tests that start a live server (Playwright)",
]
addopts = "-ra"

[tool.uv]
package = false
